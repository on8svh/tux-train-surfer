name: Snap

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      HAS_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      # The runner is Ubuntu 24.04, the same as the core24 base, so the snap can be
      # built directly on the host (no LXD/Multipass needed).
      - name: Build snap
        id: build
        run: |
          set -o pipefail
          sudo snapcraft pack --destructive-mode --verbosity=verbose 2>&1 | tee build.log
          echo "snap=$(ls *.snap | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Show build error
        if: failure()
        run: |
          # job logs need a GitHub login; annotations are public, so put the tail there
          msg=$(tail -n 40 build.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=snapcraft (${{ matrix.arch }})::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      - name: Install and smoke-test the snap
        run: |
          set -e
          sudo snap install --dangerous ${{ steps.build.outputs.snap }}
          snap connections tux-train-surfer
          tux-train-surfer --version
          tux-train-surfer --smoke-test 240 --level 9 --autoplay --mute --resolution 1280x720 \
            --screenshot "$HOME/snap/tux-train-surfer/current/smoke.png" 2>&1 | tee smoke.log
          tux-train-surfer --smoke-test 30 --lang ja --mute --resolution 1280x720 2>&1 | tee -a smoke.log
          ls -l "$HOME/snap/tux-train-surfer/current/smoke.png"

      - name: Show smoke-test error
        if: failure() && steps.build.outcome == 'success'
        run: |
          msg=$(tail -n 40 smoke.log 2>/dev/null | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=smoke test (${{ matrix.arch }})::${msg}"

      - name: Publish to edge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.HAS_STORE_CREDENTIALS == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload --release=edge ${{ steps.build.outputs.snap }}

      - name: Publish to stable
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: snapcraft upload --release=stable ${{ steps.build.outputs.snap }}

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.snap }}
          generate_release_notes: true
