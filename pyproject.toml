[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tux-train-surfer"
version = "1.0.0"
description = "A free three-track runner: Tux flees from bugs, surfs on trains and collects fish."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Tux Train Surfer contributors" }]
keywords = ["game", "tux", "linux", "penguin", "runner", "pygame"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = ["pygame>=2.5.2"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
tux-train-surfer = "tux_train_surfer.main:main"

[project.urls]
Homepage = "https://github.com/on8svh/tux-train-surfer"
Issues = "https://github.com/on8svh/tux-train-surfer/issues"

[tool.setuptools]
packages = ["tux_train_surfer"]

[tool.setuptools.package-data]
tux_train_surfer = ["locale/*.json"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B023", "B008", "B905", "E501"]

[tool.ruff.lint.per-file-ignores]
"tux_train_surfer/audio.py" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
