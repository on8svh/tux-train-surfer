name: tux-train-surfer
base: core24
version: '1.0.0'
title: Tux Train Surfer
summary: Outrun the bugs, surf the trains and collect fish with Tux!
description: |
  Tux Train Surfer is a free and open source three-track runner starring
  Tux, the Linux penguin.

  Something nasty is chasing Tux: a thief, a Kernel Panic, a Segfault
  Monster or a Proprietary Lock-in. Switch tracks, jump over firewalls and
  onto trains, duck and roll under network cables, dodge zombie processes
  and watch out for slippery ice where Tux can't steer.

  * 15 levels in 15 worlds: Antarctica, Iceland, a container marathon,
    a server-rack tunnel with blinking LEDs, a terminal railway made of
    data streams and more, plus an endless mode
  * Standing and oncoming trains, with ramps up to the roofs
  * Fish, golden fish and open-source keys to collect
  * Power-ups: magnet, Tux-board, jetpack, super jump and coffee (x2)
  * Missions that raise your permanent score multiplier
  * Skins: classic, winter hat, sysadmin, retro 90s and container captain
  * 26 languages, picked automatically from your system
  * Fully remappable keyboard and gamepad controls
  * HD ready: 720p up to 1440p, windowed or fullscreen (F11)

  Every image and sound is generated by the game's own source code, so the
  whole game is free software (MIT licence).

  Gamepad: run `sudo snap connect tux-train-surfer:joystick` once.
grade: stable
confinement: strict
license: MIT
contact: https://github.com/on8svh/tux-train-surfer/issues
issues: https://github.com/on8svh/tux-train-surfer/issues
source-code: https://github.com/on8svh/tux-train-surfer
website: https://github.com/on8svh/tux-train-surfer
icon: snap/gui/tux-train-surfer.svg
# lzo decompresses much faster than the default xz, so the game starts quicker
compression: lzo

platforms:
  amd64:
  arm64:

apps:
  tux-train-surfer:
    # Run the venv interpreter directly: it finds $SNAP/pyvenv.cfg and the installed
    # package, independent of the order of $PATH inside the snap.
    command: bin/python3 -m tux_train_surfer
    # the launcher is snap/gui/tux-train-surfer.desktop (picked up by the app name)
    extensions: [gnome]
    plugs:
      - audio-playback
      - joystick
      - opengl
      - wayland
      - x11
    environment:
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
      SDL_VIDEO_X11_WMCLASS: tux-train-surfer

parts:
  tux-train-surfer:
    plugin: python
    source: .
    stage-packages:
      # core24 does not ship Python: staging python3-venv bundles the interpreter
      - python3-venv
      # CJK glyphs for the Chinese, Japanese and Korean translations (Apache-2.0)
      - fonts-droid-fallback
